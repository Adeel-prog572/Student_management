<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>
    <p class="subtitle">Manage your students easily</p>

    <form id="studentForm">

        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >

        <input
            type="text"
            name="rollNO"
            placeholder="Roll No"
            required
        >

        <input
            type="text"
            name="className"
            placeholder="Class"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <button type="submit">Add Student</button>

    </form>

    <p id="message"></p>

    <h2>Student List</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll No</th>
                <th>Class</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
